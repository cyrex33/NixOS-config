backend = "glx";
vsync = false;

blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'"
];

fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.4;
shadow-exclude = [
  "class_g ?= 'Polybar'",
  "class_g ?= 'Rofi'",
  "class_g ?= 'Alacritty'"
];

corner-radius = 10.0;
rounded-corners-exclude = [
  "class_g ?= 'Polybar'"
];

inactive-opacity = 0.95;
active-opacity = 1.0;
opacity-rule = [
  "100:class_g = 'Alacritty'",
  "100:class_g = 'Rofi'",
  "95:class_g = 'Firefox'"
];

xrender-sync-fence = true;
use-damage = true;

unredir-if-possible = true;
unredir-if-possible-exclude = [];
